
<!DOCTYPE html>
<html>
<head>
<title>Closetiq</title>
</head>

<body>

<h1>Closetiq 👕</h1>

<button onclick="gerarLook()">Gerar Look</button>

<div id="result"></div>

<script>

async function gerarLook(){

const res = await fetch("http://localhost:8000/generate-look",{
method:"POST"
})

const data = await res.json()

const container = document.getElementById("result")

container.innerHTML=""

data.looks.forEach(l=>{

const div=document.createElement("div")

div.innerHTML="<b>Score:</b> "+l.score+"<br>"+
l.look.map(i=>i.name).join(" , ")

container.appendChild(div)

})

}

</script>

</body>
</html>
